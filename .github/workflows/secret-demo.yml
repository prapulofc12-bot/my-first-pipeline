name: Secret Masking Demo

on: push

jobs:
  verify-secret-job:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Test Secret Injection & Masking
        # Load the secret from GitHub's vault into a Linux variable named MY_KEY
        env:
          MY_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          echo "Trying to print the secret directly:"
          echo "The secret value is: $MY_KEY"
          
          # Prove the VM actually received the real text behind the scenes
          if [ "$MY_KEY" == "MySuperSecretToken999" ]; then
            echo "SUCCESS: The VM verified the exact secret value!"
          else
            echo "FAILED: Secret did not match."
          fi

