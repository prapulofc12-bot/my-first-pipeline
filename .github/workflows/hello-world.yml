name: My First Practical Pipeline

on: push

jobs:
  wsl-triggered-job:
    runs-on: ubuntu-latest

    steps:
      # NEW STEP: Pulls your app.py file onto the temporary cloud runner
      - name: Step 1 - Checkout code
        uses: actions/checkout@v4

      # NEW STEP: Runs your Python application inside the cloud runner
      - name: Step 2 - Run Python App
        run: python3 app.py

